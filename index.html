*{box-sizing:border-box}
html,body{margin:0;padding:0}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.brand{font-family:'EB Garamond',serif;font-weight:600;font-size:19px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}

.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{appearance:none;border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--muted);padding:6px 13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:#fff}
h1{font-family:'EB Garamond',serif;font-weight:600;font-size:34px;line-height:1.12;margin:18px 0 10px}
h2{font-family:'EB Garamond',serif;font-weight:600;font-size:24px;line-height:1.15;margin:26px 0 8px}
p{margin:0 0 12px}
.lead{font-size:18px;color:#2C2C33}
.muted{color:var(--muted)}
.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin:0 0 14px}
.facts{list-style:none;margin:0 0 20px;padding:0}
.facts li{position:relative;padding-left:26px;margin:0 0 8px}
.facts li::before{content:"";position:absolute;left:6px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.btn{appearance:none;border:0;border-radius:999px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:17px;padding:14px 28px;cursor:pointer;width:100%;max-width:320px}
.btn:disabled{background:#DCD6C9;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:15px;padding:10px 20px;max-width:none;width:auto}
.bar{height:5px;border-radius:999px;background:#EDE8DD;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s ease}
.pmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:16px}
.q{margin:0 0 10px;font-size:18px;line-height:1.4}
.scale{display:flex;gap:6px}
.scale button{flex:1;appearance:none;background:#fff;border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:700;font-size:17px;color:var(--ink);padding:13px 0;cursor:pointer;transition:.12s}
.scale button:hover{border-color:var(--acc)}
.scale button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.slabels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.nav{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.code{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:21px;font-weight:700;letter-spacing:.06em;background:var(--acc-t);border:1px dashed var(--acc);border-radius:12px;padding:16px;text-align:center;word-break:break-all}
.rank{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:10px 0}
.rank:last-child{border-bottom:0}
.rank .t{font-family:'EB Garamond',serif;font-size:21px;font-weight:600;flex:none}
.rank .d{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7A5A14;background:var(--acc-t);border-radius:999px;padding:3px 10px;margin-bottom:6px}
footer{border-top:1px solid var(--line);margin-top:34px;padding-top:14px;font-size:14px;color:var(--muted)}
.fld{margin:0 0 14px}
.fld label{display:block;font-size:15px;font-weight:700;margin:0 0 4px}
.fld .hint{font-size:13.5px;color:var(--muted);margin:3px 0 0}
.fld input,.fld select{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus,.ev select:focus,.ev input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.chk{display:flex;gap:9px;align-items:flex-start;margin:-2px 0 16px;font-size:15.5px}
.chk input{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--acc)}
.ev{display:grid;grid-template-columns:1fr 148px;gap:8px;margin:0 0 8px;align-items:start}
.ev .n{grid-column:1/-1;margin:12px 0 0;font-size:13.5px;color:var(--muted);font-weight:700}
.ev select,.ev input{width:100%;font:inherit;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.err{color:#B01F18;font-size:15px;margin:8px 0 0;font-weight:700}
.out{white-space:pre-wrap;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:14px;line-height:1.5;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0 12px}
.steps{font-size:13.5px;color:var(--muted);margin:0 0 10px;letter-spacing:.02em}
.steps b{color:var(--acc)}
@media(max-width:420px){ .ev{grid-template-columns:1fr} }
[hidden]{display:none!important}
@media(max-width:420px){
  body{font-size:16px} h1{font-size:28px}
  .scale button{font-size:16px;padding:12px 0}
  .btn{max-width:none}
}
</style>

<section id="result" hidden>

    <div id="r1"></div>
  </div>
  <div class="card">
    <span class="tag" data-t="tagSecond"></span>
    <div id="r2"></div>
  </div>
  <div class="card">

  </div>

  <div class="code" id="codeout"></div>
  <h2 data-t="sendH"></h2>
  <p data-t="sendText"></p>
  <div class="out" id="sendout"></div>
  <div class="nav">
    <button class="btn" onclick="copyAll()" id="copybtn"></button>
    <button class="btn ghost" onclick="restart()" data-t="again"></button>
  </div>
  <p class="small muted" style="margin-top:14px" data-t="cnote"></p>
</section>

<footer>
  <span data-t="foot"></span>
</footer>
</div>

 }

var PER = 4, lang = "ru", page = 0, ans = new Array(36).fill(0);
var P = {name:"",date:"",time:"",notime:false,city:"",country:"",live:"",ev:[{k:"",own:"",d:""},{k:"",own:"",d:""},{k:"",own:"",d:""},{k:"",own:"",d:""},{k:"",own:"",d:""},{k:"",own:"",d:""},{k:"",own:"",d:""}]};
var ITEMS = window.__ITEMS__;
var KEY = "sm36v1";

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({a:ans,p:page,l:lang,f:P})); }catch(e){} }
function load(){ try{ var s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }

function t(k){ return T[lang][k]; }

function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById("lru").setAttribute("aria-pressed", l==="ru");
  document.getElementById("len").setAttribute("aria-pressed", l==="en");
  var nodes = document.querySelectorAll("[data-t]");
  for (var i=0;i<nodes.length;i++){
    var k = nodes[i].getAttribute("data-t");
    if (T[l][k] !== undefined) nodes[i].textContent = T[l][k];
  }
  if (!document.getElementById("form").hidden) renderForm();
  if (!document.getElementById("quiz").hidden) render();
  if (!document.getElementById("result").hidden) showResult();
  document.getElementById("copybtn").textContent = t("copyAll");
  var s1 = document.getElementById("steps1");
  if (s1) s1.innerHTML = "<b>"+t("st1")+"</b> · "+t("st2")+" · "+t("st3");
  save();
}

function start(){
  document.getElementById("intro").hidden = true;
  document.getElementById("result").hidden = true;
  document.getElementById("quiz").hidden = true;
  document.getElementById("form").hidden = false;
  renderForm();
  window.scrollTo(0,0);
}

function esc(x){ return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function fld(id, label, type, val, hint){
  return '<div class="fld" id="w_'+id+'"><label for="'+id+'">'+label+'</label>'+
    '<input id="'+id+'" type="'+type+'" value="'+esc(val)+'">'+
    (hint ? '<p class="hint">'+hint+'</p>' : '')+'</div>';
}

function renderForm(){
  var h = "";
  h += fld("f_name", t("lName"), "text", P.name, t("hName"));
  h += fld("f_date", t("lDate"), "date", P.date, "");
  h += fld("f_time", t("lTime"), "time", P.time, t("hTime"));
  h += '<div class="chk"><input id="f_notime" type="checkbox"'+(P.notime?" checked":"")+'><label for="f_notime" style="font-weight:400">'+t("lNoTime")+'</label></div>';
  h += '<div id="evbox"'+(P.notime?"":" hidden")+'>';
  h += '<h3 style="margin-top:4px">'+t("evH")+'</h3><p class="small" style="color:var(--muted)">'+t("evLead")+'</p>';
  var opts = ["ev1","ev2","ev3","ev4","ev5","ev6","ev7","ev8"];
  for (var i=0;i<7;i++){
    var e = P.ev[i] || {k:"",own:"",d:""};
    h += '<div class="ev">';
    h += '<p class="n">'+(i+1)+'</p>';
    h += '<select id="e_k'+i+'"><option value="">'+t("evPick")+'</option>';
    for (var j=0;j<opts.length;j++)
      h += '<option value="'+opts[j]+'"'+(e.k===opts[j]?" selected":"")+'>'+t(opts[j])+'</option>';
    h += '</select>';
    h += '<input id="e_d'+i+'" type="date" value="'+esc(e.d)+'">';
    h += '<input id="e_o'+i+'" type="text" placeholder="'+t("evOwn")+'" value="'+esc(e.own)+'"'+(e.k==="ev8"?"":" hidden")+' style="grid-column:1/-1">';
    h += '</div>';
  }
  h += '</div>';
  h += fld("f_city", t("lCity"), "text", P.city, "");
  h += fld("f_country", t("lCountry"), "text", P.country, "");
  h += fld("f_live", t("lLive"), "text", P.live, t("hLive"));
  document.getElementById("formbox").innerHTML = h;
  document.getElementById("toquiz").textContent = t("fnext");

  document.getElementById("f_notime").onchange = function(){
    P.notime = this.checked;
    document.getElementById("evbox").hidden = !this.checked;
    document.getElementById("w_f_time").hidden = this.checked;
    readForm(); save();
  };
  document.getElementById("w_f_time").hidden = P.notime;
  for (var k=0;k<7;k++) (function(n){
    document.getElementById("e_k"+n).onchange = function(){
      document.getElementById("e_o"+n).hidden = this.value !== "ev8";
      readForm(); save();
    };
  })(k);
  var ins = document.querySelectorAll("#formbox input, #formbox select");
  for (var m=0;m<ins.length;m++) ins[m].addEventListener("change", function(){ readForm(); save(); });
}

function val(id){ var e = document.getElementById(id); return e ? e.value : ""; }

function readForm(){
  P.name = val("f_name"); P.date = val("f_date"); P.time = val("f_time");
  P.city = val("f_city"); P.country = val("f_country"); P.live = val("f_live");
  var nt = document.getElementById("f_notime");
  if (nt) P.notime = nt.checked;
  for (var i=0;i<7;i++) P.ev[i] = { k: val("e_k"+i), own: val("e_o"+i), d: val("e_d"+i) };
}

function evCount(){
  var n = 0;
  for (var i=0;i<7;i++){ var e = P.ev[i]; if (e && e.k && e.d) n++; }
  return n;
}

function formNext(){
  readForm();
  var err = document.getElementById("formerr");
  var msg = "";
  if (!P.date || !P.city.trim() || !P.country.trim() || !P.live.trim()) msg = t("errReq");
  else if (!P.notime && !P.time) msg = t("errTime");
  else if (P.notime && evCount() < 5) msg = t("errEv");
  if (msg){ err.textContent = msg; err.hidden = false; err.scrollIntoView({block:"center"}); return; }
  err.hidden = true;
  save();
  document.getElementById("form").hidden = true;
  document.getElementById("quiz").hidden = false;
  render();
  window.scrollTo(0,0);
}

function render(){
  var box = document.getElementById("qcards");
  box.innerHTML = "";
  var from = page*PER, to = Math.min(from+PER, 36);
  for (var i=from;i<to;i++){
    var d = document.createElement("div");
    d.className = "card";
    var p = document.createElement("p");
    p.className = "q";
    p.textContent = (i+1) + ". " + (lang==="ru"?ITEMS[i].ru:ITEMS[i].en);
    d.appendChild(p);
    var sc = document.createElement("div");
    sc.className = "scale";
    for (var v=1;v<=5;v++){
      var b = document.createElement("button");
      b.type="button"; b.textContent = v;
      b.setAttribute("aria-pressed", ans[i]===v);
      b.setAttribute("aria-label", v);
      (function(idx,val){ b.onclick = function(){ pick(idx,val); }; })(i,v);
      sc.appendChild(b);
    }
    d.appendChild(sc);
    var sl = document.createElement("div");
    sl.className = "slabels";
    sl.innerHTML = "<span>1 — "+t("s1")+"</span><span>5 — "+t("s5")+"</span>";
    d.appendChild(sl);
    box.appendChild(d);
  }
  var done = ans.filter(function(x){return x>0;}).length;
  document.getElementById("barfill").style.width = (done/36*100)+"%";
  document.getElementById("pcount").textContent = t("of").replace("%a",from+1).replace("%b",to);
  var mins = Math.max(1, Math.round((36-done)*7/60));
  document.getElementById("ptime").textContent = t("left").replace("%m",mins);
  var last = to>=36;
  var nb = document.getElementById("next");
  nb.textContent = last ? t("finish") : t("next");
  nb.disabled = !pageFull();
  document.getElementById("back").hidden = false;
}

function pageFull(){
  var from = page*PER, to = Math.min(from+PER, 36);
  for (var i=from;i<to;i++) if (!ans[i]) return false;
  return true;
}

function pick(i,v){
  ans[i]=v; save();
  var from = page*PER;
  var cards = document.querySelectorAll("#qcards .card");
  var c = cards[i-from];
  if (c){
    var bs = c.querySelectorAll(".scale button");
    for (var k=0;k<bs.length;k++) bs[k].setAttribute("aria-pressed", (k+1)===v);
  }
  var done = ans.filter(function(x){return x>0;}).length;
  document.getElementById("barfill").style.width = (done/36*100)+"%";
  var mins = Math.max(1, Math.round((36-done)*7/60));
  document.getElementById("ptime").textContent = t("left").replace("%m",mins);
  document.getElementById("next").disabled = !pageFull();
}

function nextPage(){
  if (!pageFull()) return;
  if ((page+1)*PER >= 36){ finish(); return; }
  page++; save(); render(); window.scrollTo(0,0);
}
function prevPage(){
  if (page>0){ page--; save(); render(); window.scrollTo(0,0); return; }
  document.getElementById("quiz").hidden = true;
  document.getElementById("form").hidden = false;
  renderForm(); window.scrollTo(0,0);
}

function sums(){
  var s = new Array(12).fill(0);
  for (var i=0;i<36;i++) s[ITEMS[i].a] += ans[i];
  return s;
}
function hex(n){ return n.toString(16).toUpperCase(); }

function code(){
  var s = sums(), out = "";
  for (var a=0;a<12;a++) out += hex(Math.min(15, Math.max(3, s[a])));
  return (lang==="ru" ? "АРХ-" : "ARC-") + out;
}

function finish(){
  document.getElementById("quiz").hidden = true;
  document.getElementById("result").hidden = false;
  showResult();
  window.scrollTo(0,0);
}

function nameOf(a){ return lang==="ru" ? ARCH[a].ru : ARCH[a].en; }
function toOf(a){ return lang==="ru" ? ARCH[a].gr : ARCH[a].ge; }
function strOf(a){ return lang==="ru" ? ARCH[a].sr : ARCH[a].se; }

function card(el, list, kind){
  var h = "";
  for (var k=0;k<list.length;k++){
    var a = list[k];
    h += '<div class="rank"><span class="t">'+nameOf(a)+'</span><span class="d">'+t("leads")+toOf(a)+'</span></div>';
  }
  var note;
  if (kind==="tie") note = t("tieNote");
  else if (kind==="growth") note = list.length>1 ? t("growthTie") : t("growth");
  else note = t("str")+strOf(list[0]);
  h += '<p class="small" style="margin:8px 0 0">'+note+'</p>';
  el.innerHTML = h;
}

function tagOf(id, key){ document.querySelector('#'+id).previousElementSibling.textContent = t(key); }

function showResult(){
  var s = sums();
  var top = Math.max.apply(null, s);
  var leaders = [];
  for (var i=0;i<12;i++) if (s[i]===top) leaders.push(i);
  var low = Math.min.apply(null, s);
  var lows = [];
  for (var j=0;j<12;j++) if (s[j]===low) lows.push(j);

  var c1 = document.getElementById("r1"), c2 = document.getElementById("r2"), c3 = document.getElementById("r3");
  var b2 = c2.parentNode;

  if (leaders.length > 1){
    card(c1, leaders, "tie");
    tagOf("r1","tagTie");
    b2.hidden = true;
  } else {
    card(c1, [leaders[0]], "lead");
    tagOf("r1","tagLead");
    var rest = [];
    for (var k=0;k<12;k++) if (k!==leaders[0]) rest.push(k);
    var sec = -Infinity;
    for (var m=0;m<rest.length;m++) if (s[rest[m]]>sec) sec = s[rest[m]];
    var seconds = [];
    for (var n=0;n<rest.length;n++) if (s[rest[n]]===sec) seconds.push(rest[n]);
    b2.hidden = false;
    card(c2, seconds, seconds.length>1 ? "tie" : "lead");
    tagOf("r2","tagSecond");
  }
  card(c3, lows, "growth");
  tagOf("r3","tagGrowth");

  document.getElementById("codeout").textContent = code();
  document.getElementById("sendout").textContent = sendText();
  document.getElementById("copybtn").textContent = t("copyAll");
}

function fmtDate(iso){
  if (!iso) return "";
  var p = iso.split("-");
  return p.length===3 ? p[2]+"."+p[1]+"."+p[0] : iso;
}

function sendText(){
  var L = [];
  L.push(lang==="ru" ? "Заявка на разбор Star & Me" : "Star & Me reading request");
  if (P.name.trim()) L.push((lang==="ru"?"Имя: ":"Name: ") + P.name.trim());
  L.push((lang==="ru"?"Дата рождения: ":"Date of birth: ") + fmtDate(P.date));
  if (P.notime){
    L.push((lang==="ru"?"Время рождения: ":"Time of birth: ") + t("noTimeLine"));
    for (var i=0;i<7;i++){
      var e = P.ev[i];
      if (e && e.k && e.d){
        var nm = e.k==="ev8" ? (e.own.trim() || t("ev8")) : t(e.k);
        L.push("  " + fmtDate(e.d) + " — " + nm);
      }
    }
  } else {
    L.push((lang==="ru"?"Время рождения: ":"Time of birth: ") + P.time);
  }
  L.push((lang==="ru"?"Город рождения: ":"City of birth: ") + P.city.trim());
  L.push((lang==="ru"?"Страна рождения: ":"Country of birth: ") + P.country.trim());
  L.push((lang==="ru"?"Живёт сейчас: ":"Lives now: ") + P.live.trim());
  L.push((lang==="ru"?"Код теста: ":"Test code: ") + code());
  return L.join("\n");
}

function copyAll(){
  var c = sendText(), b = document.getElementById("copybtn");
  function ok(){ b.textContent = t("copied"); setTimeout(function(){ b.textContent = t("copyAll"); }, 1800); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(c).then(ok, fallback);
  } else fallback();
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = c; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){}
    document.body.removeChild(ta);
  }
}

function restart(){
  ans = new Array(36).fill(0); page = 0; save();
  document.getElementById("result").hidden = true;
  document.getElementById("intro").hidden = false;
  document.getElementById("quiz").hidden = true;
  document.getElementById("form").hidden = true;
  window.scrollTo(0,0);
}

(function init(){
  var st = load();
  if (st && st.l && T[st.l]) lang = st.l;
  if (st && st.f) { for (var kk in st.f) if (st.f[kk] !== undefined) P[kk] = st.f[kk]; }
  if (st && st.a && st.a.length===36){
    ans = st.a; page = st.p || 0;
    if (ans.filter(function(x){return x>0;}).length > 0)
      document.getElementById("resumeNote").hidden = false;
  }
  setLang(lang);
})();

</script>
</body>
</html>
